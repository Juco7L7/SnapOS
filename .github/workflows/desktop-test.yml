name: Test desktop

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ "VERSION", "flake.nix", "flake.lock", "configuration.nix", "nix/**", "branding/**" ]

permissions:
  contents: read

jobs:
  desktop-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Install Nix (flakes)
        uses: DeterminateSystems/nix-installer-action@main


      - name: Boot the installed desktop in a VM
        run: |
          nix --extra-experimental-features 'nix-command flakes' build .#checks.x86_64-linux.desktop.driver -L -o driver
          mkdir -p desktop-test-out
          set +e
          ./driver/bin/nixos-test-driver --output_directory desktop-test-out
          status=$?
          ls -l desktop-test-out || true
          exit $status

      - name: Show memory use
        if: always()
        run: |
          cat desktop-test-out/metrics.txt >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload screenshots and logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: desktop-run${{ github.run_number }}
          path: desktop-test-out
          if-no-files-found: ignore
